      description: "This endpoint initiates an authorization operation.\n# Examples of scenarios\n## Basic Card Authorization\nThis is basic authorization scenario where card information is provided to perform a successful authorization. This data is the minimum amount of data Outpayce will always send as part of an authorization request.\n\n## Authorization with additional data\nThis is an authorization request that includes details related to the merchant account or acquirer information. If these details are provided, they will always be included in the payload of the request.\n\n## Authorization with 3DSv2 Data\nThis is an authorization request populated with 3DSv2 authentication details.\n\n## Authorization with Travel Segment data\nThis is an authorization request populated with flight, passenger details and ancillary services.\n\n## Authorization with Installment data\nThis is an authorization request populated with Installment data.\n\n## Authorization request with Card on File Capabilities\n### Initial Storing request of CC details\nThis is an authorization scenario where the cardholder initiates the transaction. On top of setting the _transactionInitiator_ as 'HOLDER', the API consumer also indicates the _instrumentFilingRequest_ of 'STORING'.\n\n### Cardholder Initiated Transaction with Card on File\nThis is an authorization scenario where the cardholder initiates the transaction using stored credentials. On top of setting the _transactionInitiator_ as 'HOLDER', the API consumer also indicates the _instrumentFilingRequest_ of 'REUSE'.\n\n### Merchant Initiated Transaction\nThis is an authorization scenario where the merchant initiates the transaction, on behalf of the cardholder. In that case, on top of setting the _transactionInitiator_ as 'MERCHANT', this time the API consumer also indicates the _instrumentFilingRequest_ of 'REUSE'.\n\n## Basic Alternative Payment Method Initiated Transaction\nThis is basic authorization scenario where information is provided to initiate an alternative payment method transaction and enable merchant to redirect to payment page. This data is the minimum amount of data Outpayce will always send as part of an authorization request.\n\n### Request Examples\n### Basic Card Authorization Request\n```\n  PUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\n  Content-Type: application/vnd.amadeus+json\n  ...\n{\n  \"data\": {\n    \"id\": \"{authorizationId}\",\n    \"amount\": {\n      \"value\": \"123.45\",\n      \"currencyCode\": \"EUR\"\n    },\n    \"authorizationType\": \"AUTHORIZATION_ONLY\",\n    \"method\": \"CARD\",\n    \"card\": {\n      \"vendorCode\": \"VI\",\n      \"cardNumber\": \"4000000000000001\",\n      \"cvv\": \"123\",\n      \"holderName\": \"Card Holder Name\",\n      \"expiryDate\": \"2024-12\"\n    }\n  }\n}\n```\n\n### Authorization with additional data\n```\n  PUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\n  Content-Type: application/vnd.amadeus+json\n  ...\n{\n  \"data\": {\n    \"id\": \"{authorizationId}\",\n    \"amount\": {\n      \"value\": \"123.45\",\n      \"currencyCode\": \"EUR\"\n    },\n    \"authorizationType\": \"AUTHORIZATION_ONLY\",\n    \"method\": \"CARD\",\n    \"pointOfInteraction\": {\n      \"operatingEnvironment\": {\n        \"holderInteractionMode\": \"ECOMMERCE\"\n      }\n    },\n    \"card\": {\n      \"vendorCode\": \"VI\",\n      \"cardNumber\": \"4000000000000001\",\n      \"cvv\": \"123\",\n      \"holderName\": \"Card Holder Name\",\n      \"expiryDate\": \"2024-12\"\n    },\n    \"operationContext\": {\n      \"merchantAccount\": {\n        \"name\": \"MERCHANT_ACCOUNT\",\n        \"login\": \"MERCHANT_LOGIN\",\n        \"password\": {\n          \"payload\": \"MERCHANT_PASSWORD\"\n        }\n      },\n      \"acquirerInformation\": {\n        \"acquirerBin\": \"ACQUIRER_BIN\",\n        \"acquirerCountry\": \"acquirerCountry\"\n      }\n    }\n  }\n}\n```\n### Authorization with 3DSv2 data\n```\n  PUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\n  Content-Type: application/vnd.amadeus+json\n  ...\n{\n  \"data\": {\n    \"id\": \"{authorizationId}\",\n    \"amount\": {\n      \"value\": \"123.45\",\n      \"currencyCode\": \"EUR\"\n    },\n    \"authorizationType\": \"AUTHORIZATION_ONLY\",\n    \"method\": \"CARD\",\n    \"card\": {\n      \"vendorCode\": \"VI\",\n      \"cardNumber\": \"4000000000000001\",\n      \"cvv\": \"123\",\n      \"holderName\": \"Card Holder Name\",\n      \"expiryDate\": \"2024-12\"\n    },\n    \"operationContext\": {\n      \"merchantAccount\": {\n        \"name\": \"MERCHANT_ACCOUNT\",\n        \"login\": \"MERCHANT_LOGIN\",\n        \"password\": {\n          \"payload\": \"MERCHANT_PASSWORD\"\n        }\n      },\n      \"acquirerInformation\": {\n        \"acquirerBin\": \"ACQUIRER_BIN\",\n        \"acquirerCountry\": \"acquirerCountry\"\n      },\n      \"threeDomainSecure\": {\n        \"eci\": \"05\",\n        \"cavv\": \"AJkBAWUDOQAAABu8l4F5dQAAAAB=\",\n        \"transStatus\": \"Y\",\n        \"version\": \"2.2.0\",\n        \"dsTransactionId\": \"e9bed923-7dbe-4e03-9886-1c4c3bba4934\"\n      }\n    }\n  }\n}\n```\n\n### Authorization with Travel Segment Data\n```\n  PUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\n  Content-Type: application/vnd.amadeus+json\n  ...\n  {\n    \"data\": {\n        \"id\": \"{authorizationId}\",\n        \"amount\": {\n            \"value\": \"123.45\",\n            \"currencyCode\": \"EUR\"\n        },\n        \"authorizationType\": \"AUTHORIZATION_ONLY\",\n        \"method\": \"CARD\",\n        \"card\": {\n            \"vendorCode\": \"VI\",\n            \"cardNumber\": \"4000000000000001\",\n            \"cvv\": \"123\",\n            \"expiryDate\": \"2024-12\",\n            \"holderName\": \"Card Holder Name\"\n        },\n        \"operationContext\": {\n            \"merchantAccount\": {\n                \"name\": \"MERCHANT_ACCOUNT\",\n                \"login\": \"MERCHANT_LOGIN\",\n                \"password\": {\n                    \"payload\": \"MERCHANT_PASSWORD\"\n                }\n            }\n        },\n        \"purposeOfOperation\": {\n            \"sales\": [\n                {\n                    \"reference\": \"SHFICC\",\n                    \"referenceType\": \"PNR\",\n                    \"referenceOwner\": \"1A\",\n                    \"salesItems\": [\n                        {\n                            \"category\": \"FLIGHT\",\n                            \"flightSalesDetails\": {\n                                \"flightLegs\": [\n                                    {\n                                        \"fareBasisCode\": \"XLBCRTFR\",\n                                        \"departureAirportCode\": \"MEL\",\n                                        \"departureTime\": \"2023-05-11T19:55:00Z\",\n                                        \"arrivalAirportCode\": \"BKK\",\n                                        \"arrivalTime\": \"2023-05-12T09:00:00Z\",\n                                        \"carrierCode\": \"6X\",\n                                        \"couponNumber\": \"1\",\n                                        \"flightNumber\": \"700\",\n                                        \"serviceClass\": \"X\"\n                                    },\n                                    {\n                                        \"fareBasisCode\": \"XLBCRTFR\",\n                                        \"departureAirportCode\": \"BKK\",\n                                        \"departureTime\": \"2022-05-22T22:10:00Z\",\n                                        \"arrivalAirportCode\": \"MEL\",\n                                        \"arrivalTime\": \"2022-05-23T07:30:00Z\",\n                                        \"carrierCode\": \"6X\",\n                                        \"couponNumber\": \"1\",\n                                        \"flightNumber\": \"701\",\n                                        \"serviceClass\": \"V\"\n                                    }\n                                ],\n                                \"travelAgencyName\": \"TRAVEL SHOP\",\n                                \"travelAgencyCode\": \"12345678\",\n                                \"passenger\": {\n                                    \"flightPassengerType\": \"ADULT\",\n                                    \"name\": {\n                                        \"firstName\": \"JOHN\",\n                                        \"lastName\": \"DOE\"\n                                    }\n                                }\n                            }\n                        },\n                        {\n                            \"category\": \"OTHER\",\n                            \"salesDetails\": {\n                                \"itemClass\": \"EMD\",\n                                \"productClass\": \"BAG\",\n                                \"productCode\": \"SSR\",\n                                \"itemDescriptor\": \"1ST CHECKED BAG 23KG\",\n                                \"unitPrice\": {\n                                    \"amount\": \"15.15\",\n                                    \"currencyCode\": \"EUR\"\n                                },\n                                \"consumers\": [\n                                  {\n                                      \"name\": {\n                                          \"firstName\": \"JOHN\",\n                                          \"lastName\": \"DOE\"\n                                        },\n                                      \"roles\": [\n                                          \"TRAVELER\"\n                                        ]\n                                  }\n                                ]\n                            }\n                        }\n                    ]\n                }\n            ]\n        }\n    }\n}\n```\n### Authorization with Installment Data\n```\n PUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\n Content-Type: application/vnd.amadeus+json\n ...\n{\n  \"data\": {\n    \"id\": \"{authorizationId}\",\n    \"card\": {\n      \"cvv\": \"999\",\n      \"vendorCode\": \"VI\",\n      \"expiryDate\": \"2026-06\",\n      \"cardNumber\": \"4400009999990004\"\n    },\n    \"method\": \"CARD\",\n    \"timestamp\": \"2024-08-06T06:47:38Z\",\n    \"authorizationType\": \"AUTHORIZATION_ONLY\",\n    \"operationContext\": {\n      \"acquirerInformation\": {\n        \"acquirerCountry\": \"FR\",\n        \"acquirerBin\": \"ProviderApiTest01\"\n      },\n      \"termsAndConditions\": {\n        \"installments\": {\n          \"firstInstallmentAmount\": {\n            \"value\": \"430.55\",\n            \"currencyCode\": \"BRL\"\n          },\n          \"interestAmount\": {\n            \"value\": \"30.00\",\n            \"currencyCode\": \"BRL\"\n          },\n          \"subsequentInstallmentAmount\": {\n            \"value\": \"50.00\",\n            \"currencyCode\": \"BRL\"\n          },\n          \"maxNumber\": 3,\n          \"period\": {\n            \"frequencyType\": \"MONTHLY\"\n          }\n        }\n      },\n      \"merchantAccount\": {\n        \"name\": \"1234\"\n      }\n    },\n    \"amount\": {\n      \"value\": \"500.55\",\n      \"currencyCode\": \"BRL\"\n    }\n  }\n}\n ```\n### Authorization with Card On File Capabilities\n#### Card on File Initial Request to store CC details\n```\n  PUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\n  Content-Type: application/vnd.amadeus+json\n  ...\n{\n  \"data\": {\n    \"id\": \"{authorizationId}\",\n    \"amount\": {\n      \"value\": \"123.45\",\n      \"currencyCode\": \"EUR\"\n    },\n    \"authorizationType\": \"AUTHORIZATION_ONLY\",\n    \"method\": \"CARD\",\n    \"card\": {\n      \"vendorCode\": \"VI\",\n      \"cardNumber\": \"4000000000000001\",\n      \"cvv\": \"123\",\n      \"expiryDate\": \"2024-12\",\n      \"holderName\": \"Card Holder Name\"\n    },\n    \"operationContext\": {\n      \"merchantAccount\": {\n        \"name\": \"MERCHANT_ACCOUNT\",\n        \"login\": \"MERCHANT_LOGIN\",\n        \"password\": {\n          \"payload\": \"MERCHANT_PASSWORD\"\n        }\n      },\n      \"acquirerInformation\": {\n        \"acquirerBin\": \"ACQUIRER_BIN\",\n        \"acquirerCountry\": \"acquirerCountry\"\n      },\n      \"transactionInitiator\": \"HOLDER\",\n      \"termsAndConditions\": {\n        \"credentialsOnFile\": {\n          \"instrumentFilingRequest\": \"STORING\"\n        }\n      }\n    }\n  }\n}\n```\n\n#### Cardholder Initiated Transaction with Card on File\n\n```\n  PUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\n  Content-Type: application/vnd.amadeus+json\n  ...\n{\n  \"data\": {\n    \"id\": \"{authorizationId}\",\n    \"amount\": {\n      \"value\": \"123.45\",\n      \"currencyCode\": \"EUR\"\n    },\n    \"authorizationType\": \"AUTHOR_AND_CAPTURE\",\n    \"method\": \"CARD\",\n    \"card\": {\n      \"vendorCode\": \"VI\",\n      \"cardNumber\": \"4000000000000001\",\n      \"cvv\": \"123\",\n      \"expiryDate\": \"2024-12\",\n      \"holderName\": \"Card Holder Name\"\n    },\n    \"operationContext\": {\n      \"merchantAccount\": {\n        \"name\": \"MERCHANT_ACCOUNT\",\n        \"login\": \"MERCHANT_LOGIN\",\n        \"password\": {\n          \"payload\": \"MERCHANT_PASSWORD\"\n        }\n      },\n      \"acquirerInformation\": {\n        \"acquirerBin\": \"ACQUIRER_BIN\",\n        \"acquirerCountry\": \"acquirerCountry\"\n      },\n      \"transactionInitiator\": \"HOLDER\",\n      \"termsAndConditions\": {\n        \"credentialsOnFile\": {\n          \"instrumentFilingRequest\": \"REUSE\"\n        }\n      },\n      \"transactionIntent\": \"REUSABLE\",\n      \"interactionCondition\": \"PHONE_ORDER\"\n    }\n  }\n}\n ```\n\n#### Merchant Initiated Transaction with Card on File\n```\n  PUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\n  Content-Type: application/vnd.amadeus+json\n  ...\n{\n  \"data\": {\n    \"id\": \"{authorizationId}\",\n    \"amount\": {\n      \"value\": \"123.45\",\n      \"currencyCode\": \"EUR\"\n    },\n    \"authorizationType\": \"AUTHORIZATION_ONLY\",\n    \"method\": \"CARD\",\n    \"card\": {\n      \"vendorCode\": \"VI\",\n      \"cardNumber\": \"4000000000000001\",\n      \"cvv\": \"123\",\n      \"expiryDate\": \"2024-12\",\n      \"holderName\": \"Card Holder Name\"\n    },\n    \"operationContext\": {\n      \"merchantAccount\": {\n        \"name\": \"MERCHANT_ACCOUNT\",\n        \"login\": \"MERCHANT_LOGIN\",\n        \"password\": {\n          \"payload\": \"MERCHANT_PASSWORD\"\n        }\n      },\n      \"acquirerInformation\": {\n        \"acquirerBin\": \"ACQUIRER_BIN\",\n        \"acquirerCountry\": \"acquirerCountry\"\n      },\n      \"transactionInitiator\": \"MERCHANT\",\n      \"termsAndConditions\": {\n        \"credentialsOnFile\": {\n          \"instrumentFilingRequest\": \"REUSE\",\n          \"reuseProof\": {\n                    \"traceReference\": \"123abc\"\n          }\n        }\n      },\n      \"transactionIntent\": \"REUSABLE\",\n      \"interactionCondition\": \"ON_FILE\"\n    }\n  }\n}\n```\n## Basic Alternative Payment Method Initiated Transaction\nThis is basic authorization scenario where information is provided to initiate an alternative payment method transaction and enable merchant to redirect to payment page. This data is the minimum amount of data Outpayce will always send as part of an authorization request. The following contains example of travel data for airline and hospitality domain\n\n### Request Examples\n\n## Basic Alternative Payment Method Initiated Transaction\n```\nPUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\nContent-Type: application/vnd.amadeus+json\n...\n{\n   \"data\":{\n      \"id\":\"{authorizationId}\",\n      \"method\":\"AMOP\",\n      \"amount\": {\n          \"value\": \"123.45\",\n          \"currencyCode\": \"EUR\"\n      },\n     \"instrument\": {\n            \"paymentSystem\": \"PAYPAL\"\n        },\n      \"paymentMerchantReference\": \"merchantReference\",\n      \"authorizationType\": \"AUTHOR_AND_CAPTURE\",\n     \"timestamp\": \"2024-08-06T06:47:38Z\",\n      \"pointOfInteraction\":{\n         \"location\":{\n            \"address\":{\n               \"countryCode\":\"IN\"\n            }\n          }\n         },\n      \"operationContext\":{\n         \"merchantAccount\":{\n            \"name\":\"MERCHANT_ACCOUNT\",\n            \"login\":\"MERCHANT_LOGIN\",\n            \"password\":{\n               \"payload\":\"MERCHANT_PASSWORD\"\n            }\n         },\n        \"links\": [\n          {\n            \"rel\":\"defaultCallbackURL\",\n            \"href\":\"default-callback\"\n           },\n\n          {\n             \"rel\": \"webhook\",\n              \"href\": \"https://{your-organization-name-in-outpayce}.payment.feeds.outpayce.com/{attributed-sap}/SPWREQ/v1/payment/3rd-party-gateway/{your-organization-name-in-outpayce}/authorizations/{authorizationId}/events\"\n           }\n        ],\n        \"device\": {\n          \"activeWebBrowser\": {\n             \"ietfLanguageTag\": \"en-IN\"\n          }\n        }\n      }\n   }\n}\n```\n\n## Basic Alternative Payment Method Initiated Transaction with Travel Data\n```\nPUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\nContent-Type: application/vnd.amadeus+json\n...\n{\n   \"data\":{\n      \"id\":\"{authorizationId}\",\n      \"method\":\"AMOP\",\n      \"amount\": {\n          \"value\": \"123.45\",\n          \"currencyCode\": \"EUR\"\n      },\n     \"instrument\": {\n            \"paymentSystem\": \"PAYPAL\"\n        },\n      \"paymentMerchantReference\": \"merchantReference\",\n      \"authorizationType\": \"AUTHOR_AND_CAPTURE\",\n      \"purposeOfOperation\":{\n         \"sales\":[\n            {\n               \"reference\":\"MERCHANT_REFERENCE\",\n               \"referenceOwner\":\"MERCHANT\",\n               \"referenceType\":\"PNR\",\n               \"salesItems\":[\n               {\n                  \"category\":\"FLIGHT\",\n                  \"flightSalesDetails\":{\n                     \"flightLegs\":[\n                        {\n                           \"flightNumber\":\"6X12456A\",\n                           \"departureTime\":\"2023-06-30T11:40:00Z\",\n                           \"departureAirportCode\":\"NCE\",\n                           \"arrivalTime\":\"2023-06-30T13:40:00Z\",\n                           \"arrivalAirportCode\":\"PAR\",\n                           \"carrierCode\":\"6X\",\n                           \"serviceClass\":\"L\"\n                        }\n                     ],\n\n                  \"passenger\":{\n                     \"name\":{\n                        \"firstName\":\"MARIE\",\n                        \"lastName\":\"JACOB\"\n                     },\n                     \"flightPassengerType\":\"ADULT\"\n                  }\n               }\n            }\n         ]\n        }\n      ]\n     },\n      \"pointOfInteraction\":{\n         \"location\":{\n            \"address\":{\n               \"countryCode\":\"IN\"\n            }\n           }\n         },\n     \"timestamp\": \"2024-08-06T06:47:38Z\",\n      \"operationContext\":{\n         \"merchantAccount\":{\n            \"name\":\"MERCHANT_ACCOUNT\",\n            \"login\":\"MERCHANT_LOGIN\",\n            \"password\":{\n               \"payload\":\"MERCHANT_PASSWORD\"\n            }\n         },\n        \"links\": [\n          {\n            \"rel\":\"default-callback\",\n            \"href\":\"default-callback URL\"\n           },\n\n          {\n             \"rel\": \"webhook\",\n              \"href\": \"https://{your-organization-name-in-outpayce}.payment.feeds.outpayce.com/{attributed-sap}/SPWREQ/v1/payment/3rd-party-gateway/{your-organization-name-in-outpayce}/authorizations/{authorizationId}/events\"\n           }\n        ],\n        \"device\": {\n          \"activeWebBrowser\": {\n             \"ietfLanguageTag\": \"en-IN\"\n          }\n        }\n      }\n   }\n}\n```\n## Basic Alternative Payment Method Initiated Transaction with Hospitality Data\n```\nPUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\nContent-Type: application/vnd.amadeus+json\n\n...\n{\n\t\"data\": {\n\t\t\"id\": \"-298e3a0b-e78a-47e9-9c02-a6c8b5a913e5\",\n\t\t\"method\": \"AMOP\",\n\t\t\"purposeOfOperation\": {\n\t\t\t\"sales\": [\n\t\t\t\t{\n\t\t\t\t\t\"reference\": \"645176123\",\n\t\t\t\t\t\"referenceOwner\": \"ABC\",\n\t\t\t\t\t\"referenceType\": \"ConfirmID\"\n\t\t\t\t}\n\t\t\t]\n\t\t},\n\t\t\"pointOfInteraction\":\n\t\t  {\n\t\t    \"reference\":\"20182436\",\n\t\t    \"referenceType\":\"propertyId\",\n        \"referenceOwner\":\"iHotelier\",\n\t\t      \"location\":\n\t\t        {\n\t\t         \"address\": {\n\t\t\t\t\t   \"countryCode\": \"US\"\n\t\t\t\t    }\n\t\t \t}\n\t\t},\n\t\t\"timestamp\": \"2025-08-01T06:40:52Z\",\n\t\t\"operationContext\": {\n\t\t\t\"merchantAccount\": {\n\t\t\t\t\"name\": \"AM0000000\",\n\t\t\t\t\"login\": \"amadeus_test\",\n\t\t\t\t\"password\": {\n\t\t\t\t\t\"payload\": \"test\"\n\t\t\t\t}\n\t\t\t},\n\t\t\t\"links\": [\n\t\t\t\t{\n\t\t\t\t\t\"rel\": \"default-callback\",\n\t\t\t\t\t\"href\": \"default-callback-url\"\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"rel\": \"webhook\",\n\t\t\t\t\t\"href\": \"webhook-url\"\n\t\t\t\t}\n\t\t\t],\n\t\t\t\"device\": {\n\t\t\t\t\"activeWebBrowser\": {\n\t\t\t\t\t\"ietfLanguageTag\": \"en\"\n\t\t\t\t}\n\t\t\t}\n\t\t},\n\t\t\"amount\": {\n\t\t\t\"value\": \"1250.50\",\n\t\t\t\"currencyCode\": \"USD\"\n\t\t},\n\t\t\"instrument\": {\n\t\t\t\"paymentSystem\": \"IDEAL\"\n\t\t},\n\t\t\"paymentMerchantReference\": \"227943000_645176123_1232\",\n\t\t\"authorizationType\": \"AUTHOR_AND_CAPTURE\"\n\t}\n}\n```\n## Asynchronous alternative payment method with web redirection:\n\nWhen the client agrees to pay with an Asynchronous alternative payment method with web redirection like Multicaixa for an\namount of _123.45€_, Outpayce captures the selected alternative payment method, collects the required information and sendsrequest to your system with a time-limit until when the order would be valid such as:\n```\nPUT https://your-host-name/outpayce/v1/authorizations/{id}\nContent-Type: application/vnd.amadeus+json\n{\n  \"data\": {\n    \"id\": \"a29874-f68c189c-c617-5876-b1ae-6d6aec9c812a\",\n    \"method\": \"AMOP\",\n    \"purposeOfOperation\": {\n      \"validUntil\": \"2023-05-23T23:59:55Z\",\n      \"sales\": [\n        {\n          \"reference\": \"MERCHANT_REFERENCE\",\n          \"referenceOwner\": \"MERCHANT\",\n          \"referenceType\": \"PNR\",\n          \"salesItems\": [\n            {\n              \"category\": \"FLIGHT\",\n              \"flightSalesDetails\": {\n                \"flightLegs\": [\n                  {\n                    \"flightNumber\": \"6X12456A\",\n                    \"departureTime\": \"2023-06-30T11:40:00Z\",\n                    \"departureAirportCode\": \"HAN\",\n                    \"arrivalTime\": \"2023-06-30T13:40:00Z\",\n                    \"arrivalAirportCode\": \"SGN\",\n                    \"carrierCode\": \"6X\",\n                    \"serviceClass\": \"L\"\n                  }\n                ],\n                \"passenger\": {\n                  \"name\": {\n                    \"firstName\": \"MARIE\",\n                    \"lastName\": \"JACOB\"\n                  },\n                  \"flightPassengerType\": \"ADULT\"\n                }\n              }\n            }\n          ]\n        }\n      ]\n    },\n    \"pointOfInteraction\": {\n      \"location\": {\n        \"address\": {\n          \"countryCode\": \"IN\"\n        }\n      }\n    },\n    \"timestamp\": \"2023-05-22T23:59:55Z\",\n    \"operationContext\": {\n      \"merchantAccount\": {\n        \"name\": \"MERCHANT_ACCOUNT\",\n        \"login\": \"MERCHANT_LOGIN\",\n        \"password\": {\n          \"payload\": \"MERCHANT_PASSWORD\"\n        }\n      },\n      \"links\": [\n           {\n            \"rel\":\"default-callback\",\n            \"href\":\"default-callback URL\"\n           },\n        {\n          \"href\": \"https://{your-organization-name-in-outpayce}.payment.feeds.outpayce.com/{attributed-sap}/SPWREQ/v1/payment/3rd-party-gateway/{your-organization-name-in-outpayce}/{operation-collection}/{operation-id}/events\",\n          \"rel\": \"webhook\"\n        }\n      ],\n      \"device\": {\n        \"activeWebBrowser\": {\n          \"ietfLanguageTag\": \"en-IN\"\n        }\n      }\n    },\n    \"amount\": {\n      \"value\": \"45230.45\",\n      \"currencyCode\": \"INR\"\n    },\n    \"instrument\": {\n      \"paymentSystem\": \"MULTICAIXA\"\n    },\n    \"paymentMerchantReference\": \"merchantReference\",\n    \"authorizationType\": \"AUTHOR_AND_CAPTURE\"\n  }\n}\n```\nThe validUntil field indicates the time until which the sales reference remains valid. In other words, the merchant will hold the sales item until this time. If the customer is unable to complete the payment within this period, the sales item will be cancelled.\n\n## Asynchronous Alternative Payment Methods without web redirection\nWhen the client agrees to pay with an asynchronous alternative payment method for an amount of _123.45€_, Outpayce captures the selected alternative payment method, collects the required information and sends a request to your system with a time-limit until when the order would be valid such as:\n\n```\nPUT https://your-host-name/outpayce/v1/authorizations/{id}\nContent-Type: application/vnd.amadeus+json\n{\n  \"data\": {\n    \"id\": \"a29874-f68c189c-c617-5876-b1ae-6d6aec9c812a\",\n    \"method\": \"AMOP\",\n    \"purposeOfOperation\": {\n      \"validUntil\": \"2023-05-23T23:59:55Z\",\n      \"sales\": [\n        {\n          \"reference\": \"MERCHANT_REFERENCE\",\n          \"referenceOwner\": \"MERCHANT\",\n          \"referenceType\": \"PNR\",\n          \"salesItems\": [\n            {\n              \"category\": \"FLIGHT\",\n              \"flightSalesDetails\": {\n                \"flightLegs\": [\n                  {\n                    \"flightNumber\": \"6X12456A\",\n                    \"departureTime\": \"2023-06-30T11:40:00Z\",\n                    \"departureAirportCode\": \"HAN\",\n                    \"arrivalTime\": \"2023-06-30T13:40:00Z\",\n                    \"arrivalAirportCode\": \"SGN\",\n                    \"carrierCode\": \"6X\",\n                    \"serviceClass\": \"L\"\n                  }\n                ],\n                \"passenger\": {\n                  \"name\": {\n                    \"firstName\": \"MARIE\",\n                    \"lastName\": \"JACOB\"\n                  },\n                  \"flightPassengerType\": \"ADULT\"\n                }\n              }\n            }\n          ]\n        }\n      ]\n    },\n    \"pointOfInteraction\": {\n      \"location\": {\n        \"address\": {\n          \"countryCode\": \"IN\"\n        }\n      }\n    },\n    \"timestamp\": \"2023-05-22T23:59:55Z\",\n    \"operationContext\": {\n      \"merchantAccount\": {\n        \"name\": \"MERCHANT_ACCOUNT\",\n        \"login\": \"MERCHANT_LOGIN\",\n        \"password\": {\n          \"payload\": \"MERCHANT_PASSWORD\"\n        }\n      },\n      \"links\": [\n        {\n          \"href\": \"https://{your-organization-name-in-outpayce}.payment.feeds.outpayce.com/{attributed-sap}/SPWREQ/v1/payment/3rd-party-gateway/{your-organization-name-in-outpayce}/{operation-collection}/{operation-id}/events\",\n          \"rel\": \"webhook\"\n        }\n      ],\n      \"device\": {\n        \"activeWebBrowser\": {\n          \"ietfLanguageTag\": \"en-IN\"\n        }\n      }\n    },\n    \"amount\": {\n      \"value\": \"45230.45\",\n      \"currencyCode\": \"INR\"\n    },\n    \"instrument\": {\n      \"paymentSystem\": \"NAPAS_PAY_LATER\"\n    },\n    \"paymentMerchantReference\": \"merchantReference\",\n    \"authorizationType\": \"AUTHOR_AND_CAPTURE\"\n  }\n}\n```\nThe validUntil field indicates the time until which the sales reference remains valid. In other words, the merchant will hold the sales item until this time. If the customer is unable to complete the payment within this period, the sales item will be cancelled.\n\nYour application parses the request and after processing it, generates a reference and returns it in the externalId in the response message. Below is the example:\n  ```\nHTTP/1.1 202 Accepted\nLocation: https://{your-host-name}/outpayce/v1/authorizations/{authorizationId}\nContent-Type: application/vnd.amadeus+json\n{\n\"data\": {\n    \"externalId\": \"EXTERNAL_ID\",\n    \"status\": \"ACCEPTED\",\n    \"timestamp\": \"2032-11-28T14:59:55Z\"\n  }\n }\n  ```\n\n#### AMOP Authorization Request with Payer Inputs\nSome AMOPs require input from the payer to proceed with the transaction. These inputs may include details\nsuch as phone or mobile number, payment ID, country, account number, and other relevant information.\n\n##### UPI ID as input\n```\nPUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\nContent-Type: application/vnd.amadeus+json\n...\n{\n  \"data\": {\n    \"id\": \"{authorizationId}\",\n    \"method\": \"AMOP\",\n    \"amount\": {\n      \"value\": \"123\",\n      \"currencyCode\": \"INR\"\n    },\n    \"instrument\": {\n      \"paymentSystem\": \"UPI\",\n      \"reference\": \"testsystem@upi\",\n      \"referenceType\": \"ALIAS\"\n    },\n    \"paymentMerchantReference\": \"merchantReference\",\n    \"authorizationType\": \"AUTHOR_AND_CAPTURE\",\n    \"purposeOfOperation\": {\n      \"sales\": [\n        {\n          \"reference\": \"RECLOC\",\n          \"referenceOwner\": \"MERCHANT\",\n          \"referenceType\": \"PNR\",\n          \"salesItems\": [\n            {\n              \"category\": \"FLIGHT\",\n              \"flightSalesDetails\": {\n                \"flightLegs\": [\n                  {\n                    \"flightNumber\": \"6X12456A\",\n                    \"departureTime\": \"2023-06-30T11:40:00Z\",\n                    \"departureAirportCode\": \"NCE\",\n                    \"arrivalTime\": \"2023-06-30T13:40:00Z\",\n                    \"arrivalAirportCode\": \"PAR\",\n                    \"carrierCode\": \"6X\",\n                    \"serviceClass\": \"L\"\n                  }\n                ],\n                \"passenger\": {\n                  \"name\": {\n                    \"firstName\": \"MARIE\",\n                    \"lastName\": \"JACOB\"\n                  },\n                  \"flightPassengerType\": \"ADULT\"\n                }\n              }\n            }\n          ]\n        }\n      ]\n    },\n    \"pointOfInteraction\": {\n      \"location\": {\n        \"address\": {\n          \"countryCode\": \"IN\"\n        }\n      }\n    },\n    \"timestamp\": \"2024-08-06T06:47:38Z\",\n    \"operationContext\": {\n      \"merchantAccount\": {\n        \"name\": \"MERCHANT_ACCOUNT\",\n        \"login\": \"MERCHANT_LOGIN\",\n        \"password\": {\n          \"payload\": \"MERCHANT_PASSWORD\"\n        }\n      },\n      \"links\": [\n        {\n          \"rel\": \"default-callback\",\n          \"href\": \"default-callback URL\"\n        },\n        {\n          \"rel\": \"webhook\",\n          \"href\": \"https://{your-organization-name-in-outpayce}.payment.feeds.outpayce.com/{attributed-sap}/SPWREQ/v1/payment/3rd-party-gateway/{your-organization-name-in-outpayce}/authorizations/{authorizationId}/events\"\n        }\n      ],\n      \"device\": {\n        \"activeWebBrowser\": {\n          \"ietfLanguageTag\": \"en-IN\"\n        }\n      }\n    }\n  }\n}\n```\n##### Payer Bank's Country as Input\n```\nPUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\nContent-Type: application/vnd.amadeus+json\n...\n {\n  \"data\": {\n    \"id\": \"{authorizationId}\",\n    \"method\": \"AMOP\",\n    \"amount\": {\n      \"value\": \"123\",\n      \"currencyCode\": \"EUR\"\n    },\n    \"bankAccount\": {\n      \"paymentSystem\": \"SCT_INSTANT\",\n      \"bank\": {\n        \"countryCode\": \"FR\"\n      }\n    },\n    \"paymentMerchantReference\": \"merchantReference\",\n    \"authorizationType\": \"AUTHOR_AND_CAPTURE\",\n    \"purposeOfOperation\": {\n      \"sales\": [\n        {\n          \"reference\": \"RECLOC\",\n          \"referenceOwner\": \"MERCHANT\",\n          \"referenceType\": \"PNR\",\n          \"salesItems\": [\n            {\n              \"category\": \"FLIGHT\",\n              \"flightSalesDetails\": {\n                \"flightLegs\": [\n                  {\n                    \"flightNumber\": \"6X12456A\",\n                    \"departureTime\": \"2023-06-30T11:40:00Z\",\n                    \"departureAirportCode\": \"NCE\",\n                    \"arrivalTime\": \"2023-06-30T13:40:00Z\",\n                    \"arrivalAirportCode\": \"PAR\",\n                    \"carrierCode\": \"6X\",\n                    \"serviceClass\": \"L\"\n                  }\n                ],\n                \"passenger\": {\n                  \"name\": {\n                    \"firstName\": \"MARIE\",\n                    \"lastName\": \"JACOB\"\n                  },\n                  \"flightPassengerType\": \"ADULT\"\n                }\n              }\n            }\n          ]\n        }\n      ]\n    },\n    \"pointOfInteraction\": {\n      \"location\": {\n        \"address\": {\n          \"countryCode\": \"FR\"\n        }\n      }\n    },\n   \"timestamp\": \"2024-08-06T06:47:38Z\",\n    \"operationContext\": {\n      \"merchantAccount\": {\n        \"name\": \"MERCHANT_ACCOUNT\",\n        \"login\": \"MERCHANT_LOGIN\",\n        \"password\": {\n          \"payload\": \"MERCHANT_PASSWORD\"\n        }\n      },\n      \"links\": [\n        {\n          \"rel\": \"default-callback\",\n          \"href\": \"default-callback URL\"\n        },\n        {\n          \"rel\": \"webhook\",\n          \"href\": \"https://{your-organization-name-in-outpayce}.payment.feeds.outpayce.com/{attributed-sap}/SPWREQ/v1/payment/3rd-party-gateway/{your-organization-name-in-outpayce}/authorizations/{authorizationId}/events\"\n        }\n      ],\n      \"device\": {\n        \"activeWebBrowser\": {\n          \"ietfLanguageTag\": \"en\"\n        }\n      }\n    }\n  }\n}\n```\n##### Account Number as input\n```\nPUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\nContent-Type: application/vnd.amadeus+json\n...\n{\n  \"data\": {\n    \"id\": \"{authorizationId}\",\n    \"method\": \"AMOP\",\n    \"amount\": {\n      \"value\": \"123\",\n      \"currencyCode\": \"AUD\"\n    },\n    \"bankAccount\": {\n      \"paymentSystem\": \"PAYTO\",\n      \"branchCode\": \"112334\",\n      \"reference\": \"789878656565\",\n      \"referenceType\": \"BANK_ACCOUNT_NO\"\n    },\n    \"paymentMerchantReference\": \"merchantReference\",\n    \"authorizationType\": \"AUTHOR_AND_CAPTURE\",\n    \"purposeOfOperation\": {\n      \"sales\": [\n        {\n          \"reference\": \"RECLOC\",\n          \"referenceOwner\": \"MERCHANT\",\n          \"referenceType\": \"PNR\",\n          \"salesItems\": [\n            {\n              \"category\": \"FLIGHT\",\n              \"flightSalesDetails\": {\n                \"flightLegs\": [\n                  {\n                    \"flightNumber\": \"6X12456A\",\n                    \"departureTime\": \"2023-06-30T11:40:00Z\",\n                    \"departureAirportCode\": \"NCE\",\n                    \"arrivalTime\": \"2023-06-30T13:40:00Z\",\n                    \"arrivalAirportCode\": \"PAR\",\n                    \"carrierCode\": \"6X\",\n                    \"serviceClass\": \"L\"\n                  }\n                ],\n                \"passenger\": {\n                  \"name\": {\n                    \"firstName\": \"MARIE\",\n                    \"lastName\": \"JACOB\"\n                  },\n                  \"flightPassengerType\": \"ADULT\"\n                }\n              }\n            }\n          ]\n        }\n      ]\n    },\n    \"pointOfInteraction\": {\n      \"location\": {\n        \"address\": {\n          \"countryCode\": \"AU\"\n        }\n      }\n    },\n    \"timestamp\": \"2024-08-06T06:47:38Z\",\n    \"operationContext\": {\n      \"merchantAccount\": {\n        \"name\": \"MERCHANT_ACCOUNT\",\n        \"login\": \"MERCHANT_LOGIN\",\n        \"password\": {\n          \"payload\": \"MERCHANT_PASSWORD\"\n        }\n      },\n      \"links\": [\n        {\n          \"rel\": \"default-callback\",\n          \"href\": \"default-callback URL\"\n        },\n        {\n          \"rel\": \"webhook\",\n          \"href\": \"https://{your-organization-name-in-outpayce}.payment.feeds.outpayce.com/{attributed-sap}/SPWREQ/v1/payment/3rd-party-gateway/{your-organization-name-in-outpayce}/authorizations/{authorizationId}/events\"\n        }\n      ],\n      \"device\": {\n        \"activeWebBrowser\": {\n          \"ietfLanguageTag\": \"en\"\n        }\n      }\n    }\n  }\n}\n ```\n##### Mobile Number as input\n ```\nPUT https://{your-host-name}/outpayce/v1/authorizations/{authorizationId} HTTP/1.1\nContent-Type: application/vnd.amadeus+json\n...\n{\n  \"data\": {\n    \"id\": \"{authorizationId}\",\n    \"method\": \"AMOP\",\n    \"amount\": {\n      \"value\": \"123\",\n      \"currencyCode\": \"JOD\"\n    },\n    \"instrument\": {\n      \"paymentSystem\": \"CLIQ\",\n      \"holder\": {\n        \"contacts\": [{\n          \"phone\": {\n            \"text\": \"009934758374\"\n          }\n        }\n        ]\n      }\n    },\n    \"paymentMerchantReference\": \"merchantReference\",\n    \"authorizationType\": \"AUTHOR_AND_CAPTURE\",\n    \"purposeOfOperation\": {\n      \"sales\": [\n        {\n          \"reference\": \"RECLOC\",\n          \"referenceOwner\": \"MERCHANT\",\n          \"referenceType\": \"PNR\",\n          \"salesItems\": [\n            {\n              \"category\": \"FLIGHT\",\n              \"flightSalesDetails\": {\n                \"flightLegs\": [\n                  {\n                    \"flightNumber\": \"6X12456A\",\n                    \"departureTime\": \"2023-06-30T11:40:00Z\",\n                    \"departureAirportCode\": \"AMM\",\n                    \"arrivalTime\": \"2023-06-30T13:40:00Z\",\n                    \"arrivalAirportCode\": \"LHR\",\n                    \"carrierCode\": \"6X\",\n                    \"serviceClass\": \"L\"\n                  }\n                ],\n                \"passenger\": {\n                  \"name\": {\n                    \"firstName\": \"MARIE\",\n                    \"lastName\": \"JACOB\"\n                  },\n                  \"flightPassengerType\": \"ADULT\"\n                }\n              }\n            }\n          ]\n        }\n      ]\n    },\n    \"pointOfInteraction\": {\n      \"location\": {\n        \"address\": {\n          \"countryCode\": \"JO\"\n        }\n      }\n    },\n   \"timestamp\": \"2024-08-06T06:47:38Z\",\n    \"operationContext\": {\n      \"merchantAccount\": {\n        \"name\": \"MERCHANT_ACCOUNT\",\n        \"login\": \"MERCHANT_LOGIN\",\n        \"password\": {\n          \"payload\": \"MERCHANT_PASSWORD\"\n        }\n      },\n      \"links\": [\n        {\n          \"rel\": \"default-callback\",\n          \"href\": \"default-callback URL\"\n        },\n        {\n          \"rel\": \"webhook\",\n          \"href\": \"https://{your-organization-name-in-outpayce}.payment.feeds.outpayce.com/{attributed-sap}/SPWREQ/v1/payment/3rd-party-gateway/{your-organization-name-in-outpayce}/authorizations/{authorizationId}/events\"\n        }\n      ],\n      \"device\": {\n        \"activeWebBrowser\": {\n          \"ietfLanguageTag\": \"en\"\n        }\n      }\n    }\n  }\n}\n```\nResponse\n```\nHTTP/1.1 202 Accepted\nContent-Type: application/vnd.amadeus+json\n{\n  \"data\": {\n    \"externalId\": \"1WX80207GX642472G\",\n    \"status\": \"ACCEPTED\",\n    \"timestamp\": \"2023-05-22T23:59:55Z\",\n    \"targetPayloads\": [\n      {\n        \"href\": \"REDIRECTION_WEB_PAGE\",\n        \"method\": \"POST\",\n        \"formPayload\": [\n          {\n            \"name\": \"amount\",\n            \"value\": \"123.45\"\n          },\n          {\n            \"name\": \"currencyCode\",\n            \"value\": \"EUR\"\n          }\n        ]\n      }\n    ]\n  }\n}\n\n```\nError response\n```\n{\n  \"errors\": [\n    {\n      \"status\": 400,\n      \"code\": 477,\n      \"title\": \"INVALID FORMAT\",\n      \"detail\": \"The currency code is invalid \",\n      \"source\":\n      {\n        \"parameter\": \"amount/currencyCode\"\n      }\n    }\n  ]\n}\n```\nHTTP: 403\n```\n{\n  \"errors\": [\n    {\n      \"status\": 403,\n      \"code\": 1666,\n      \"title\": \"NOT ALLOWED\"\n    }\n  ]\n}\n```\nHTTP: 409\n```\n{\n  \"errors\": [\n    {\n      \"status\": 409,\n      \"code\": 39041,\n      \"title\": \"DUPLICATE REQUEST ERROR\"\n    }\n  ]\n}\n```\nHTTP: 422\n```\n{\n  \"errors\": [\n    {\n      \"status\": 422,\n      \"code\": 11,\n      \"title\": \"UNABLE TO PROCESS\"\n    }\n  ]\n}\n```\nHTTP: 424\n```\n{\n  \"errors\": [\n    {\n      \"status\": 424,\n      \"code\": 33471,\n      \"title\": \"PAYMENT ACTION DECLINED\"\n    }\n  ]\n}\n```\nHTTP: 500\n```\n{\n  \"errors\": [\n    {\n      \"status\": 500,\n      \"code\": 414,\n      \"title\": \"INTERNAL PROCESSING ERROR\"\n    }\n  ]\n}\n```\nHTTP: 502\n```\n{\n  \"errors\": [\n    {\n      \"status\": 502,\n      \"code\": 5038,\n      \"title\": \"TIMEOUT ERR